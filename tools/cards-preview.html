<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../src/ui/style.css">
<style>body{overflow:auto;padding:20px;background:#f4f2ec}.row{display:flex;gap:14px;margin-bottom:20px;align-items:flex-end}.big .card{zoom:2}</style></head>
<body><svg id="defs" width="0" height="0" style="position:absolute"></svg>
<div class="row big" id="r1"></div><div class="row big" id="r2"></div><div class="row" id="r3"></div>
<script type="module">
import { sharedDefs } from '../src/ui/art.js';
import { resourceCard, devCard, cardBack, buildingCostsCard, specialCard } from '../src/ui/cards.js';
document.getElementById('defs').innerHTML = '<defs>' + sharedDefs() + '</defs>';
document.getElementById('r1').innerHTML = ['brick','lumber','wool','grain','ore'].map(r => resourceCard(r)).join('') + cardBack() + cardBack('dev');
document.getElementById('r2').innerHTML = ['knight','roadBuilding','yearOfPlenty','monopoly','vp'].map((t,i) => devCard(t,{index:i})).join('') + specialCard('longestRoad') + specialCard('largestArmy');
document.getElementById('r3').innerHTML = [0,1,2,3,4].map(i => devCard('vp',{index:i})).join('') + buildingCostsCard('blue');
</script></body></html>
