<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#f7f6f2}svg{width:900px;height:800px;display:block}</style></head>
<body><svg id="defs" width="0" height="0" style="position:absolute"></svg><svg id="board"></svg>
<script type="module">
import { newGame } from '../src/engine/rules.js';
import { createBoard } from '../src/ui/board.js';
import { sharedDefs } from '../src/ui/art.js';
import { GEO } from '../src/engine/geometry.js';
document.getElementById('defs').innerHTML = '<defs>' + sharedDefs() + '</defs>';
const s = newGame({ numPlayers: 4, board: new URLSearchParams(location.search).get('b') || 'beginner' }, Math.random);
s.buildings[12] = { player: 0, type: 'settlement' }; s.buildings[20] = { player: 1, type: 'city' };
s.buildings[33] = { player: 2, type: 'settlement' }; s.buildings[40] = { player: 3, type: 'city' };
s.roads[GEO.vertices[12].edges[0]] = 0; s.roads[GEO.vertices[20].edges[1]] = 1; s.roads[GEO.vertices[33].edges[0]] = 2; s.roads[GEO.vertices[40].edges[0]] = 3;
const b = createBoard(document.getElementById('board')); b.render(s);
</script></body></html>
