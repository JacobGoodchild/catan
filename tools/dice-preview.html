<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../src/ui/style.css"></head>
<body style="background:#ebe6da"><div id="dice" class="dice-overlay" hidden></div>
<script type="module">
import { rollDice } from '../src/ui/dice.js';
